apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sentiment-api
  labels:
    app: sentiment-api
spec:
  type: {{ .Values.service.type }}
  selector:
    app: sentiment-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}