apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sentiment-api
  labels:
    app: sentiment-api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: sentiment-api
  template:
    metadata:
      labels:
        app: sentiment-api
    spec:
      containers:
        - name: sentiment-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-model-config
                  key: MODEL_NAME
            - name: MODEL_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-model-config
                  key: MODEL_ENVIRONMENT
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}