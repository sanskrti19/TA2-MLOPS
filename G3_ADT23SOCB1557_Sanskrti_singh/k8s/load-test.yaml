apiVersion: v1
kind: Pod
metadata:
name: sentiment-load-test
namespace: sentiment-analysis
spec:
restartPolicy: Never
containers:
- name: load-test
image: busybox:1.36
command:
- /bin/sh
- -c
- |
while true; do
wget -q -O-
--post-data='{"text":"This application is excellent and I love it"}'
--header='Content-Type: application/json'
http://sentiment-api-sentiment-api:8000/predict
sleep 0.2
done